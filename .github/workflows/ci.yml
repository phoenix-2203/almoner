name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (45 vault scenarios + token)
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::explicit-counter-loop
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: wasm/*.wasm
      - name: Commit the built contracts back to the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wasm/*.wasm
          if git diff --cached --quiet; then echo "contracts unchanged"; exit 0; fi
          git commit -m "build: contracts built by CI from ${GITHUB_SHA::7}"
          git push origin HEAD:main || echo "main moved on; the next run will commit them"
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Cross-language tests (TS-signed quote fixture is verified by the Rust tests)
        run: npm test
