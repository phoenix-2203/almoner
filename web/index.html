<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almoner Vault</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">◆</span> Almoner <small>on NEAR</small></div>
  <form id="pick"><input id="vaultInput" placeholder="vault.yourname.testnet" spellcheck="false"><button>Load</button></form>
</header>
<main>
  <p class="lede">Every agent purchase, accounted for. Rules a person signed, enforced by a NEAR contract: agents hold keys that can only ask; sellers sign every price; money waits in escrow until delivery is checked.</p>
  <section id="vault" class="cards"></section>
  <section>
    <h2>Task mandates</h2>
    <div id="tasks"></div>
  </section>
  <section>
    <h2>Every decision <span class="muted" id="pcount"></span></h2>
    <div class="filters" id="filters"></div>
    <div class="tablewrap"><table id="purchases"><thead><tr><th>#</th><th>When</th><th>Decision</th><th>Seller</th><th>Item</th><th class="num">Price</th><th>Why</th></tr></thead><tbody></tbody></table></div>
  </section>
